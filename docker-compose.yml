services:
  # TODO: use NO-SQL database for shorts
  # app-db:
  #   image: mongodb/mongodb-community-server:6.0-ubi8
  #   ports:
  #     - "27017:27017"
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: root
  #     MONGO_INITDB_ROOT_PASSWORD: example
  #   volumes:
  #     - app-db-data:/data/db
  #   restart: unless-stopped

  app-db:
    image: postgres:18.1-bookworm
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - app-db-data:/var/lib/postgresql
    restart: unless-stopped

  token-repository:
    image: valkey/valkey:8.1.1 # for open-source Redis
    ports:
      - "6379:6379"
    environment:
      VALKEY_EXTRA_FLAGS: "--appendonly yes --appendfsync everysec" # optimized for consistency, avoid duplicates
    volumes:
      - token-repository-data:/data
    restart: unless-stopped

volumes:
  app-db-data:
  token-repository-data:
